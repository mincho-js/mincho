cacheFolder: ./.yarn/cache

checksumBehavior: reset

compressionLevel: mixed

enableGlobalCache: true

globalFolder: ./.yarn/cache/global

nodeLinker: pnp

pnpFallbackMode: none

pnpMode: strict

npmMinimalAgeGate: 7d

npmPreapprovedPackages:
  # Security fixes for GHSA-g3hv-75wg-m249 and GHSA-3g3m-2fjr-6pw4.
  - minimatch@11.0.3
  - glob@14.0.3
  - "@isaacs/nonrecursive-glob-match@1.0.3"
  - path-scurry@3.0.0
  - "@mincho-js/*"
  - "@turbo/*"
  - turbo

packageExtensions:
  next@16.4.3:
    peerDependencies:
      next-rspack: 16.4.3
    peerDependenciesMeta:
      next-rspack:
        optional: true
  nextra@*:
    peerDependencies:
      typescript: "*"

plugins:
  - path: .yarn/plugins/@yarnpkg/plugin-outdated.cjs
    spec: "https://mskelton.dev/yarn-outdated/v3"

yarnPath: .yarn/releases/yarn-4.18.1.cjs
