name: Dependency Audit

on:
  schedule:
    # Cron format: minute hour day-of-month month day-of-week (UTC).
    # every Saturday at 01:00 UTC.
    - cron: "0 1 * * 6"
  workflow_dispatch: {}

jobs:
  audit:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup
        uses: ./.github/actions/node-setup

      - name: Check security advisories
        run: yarn audit

      # Upstream maintenance notices do not suppress any security advisories.
      - name: Report upstream deprecations
        continue-on-error: true
        run: yarn npm audit --all --recursive
