name: pull-request
on:
  # Execute only default-branch action code with GITHUB_TOKEN in this context.
  # PR-head objects are fetched for ancestry, never checked out or executed.
  pull_request_target:
    types: [opened, reopened, synchronize, edited]
jobs:
  check-fast-forward:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: fast-forward-${{ github.event.pull_request.number }}
      cancel-in-progress: false

    permissions:
      contents: read
      # We appear to need write permission for both pull-requests and
      # issues in order to post a comment to a pull request.
      pull-requests: write
      issues: write

    steps:
      # Only trusted action code is executed; PR commits are fetched as Git data.
      - name: Checkout action from the default branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
          sparse-checkout: .github/actions/fast-forward

      - name: Checking if fast forwarding is possible
        uses: ./.github/actions/fast-forward
        with:
          merge: false
          # To reduce the workflow's verbosity, use 'on-error'
          # to only post a comment when an error occurs, or 'never' to
          # never post a comment.  (In all cases the information is
          # still available in the step's summary.)
          comment: always
