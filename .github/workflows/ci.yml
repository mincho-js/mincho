name: CI

# This action works with pull requests and pushes
on: [push, pull_request]

jobs:
  pre_job:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      should_skip: ${{ steps.skip_check.outputs.should_skip }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check SkipAction
        id: skip_check
        uses: fkirc/skip-duplicate-actions@b974a9395958c231af965b70070979a577efa578 # v5.3.2
        with:
          concurrent_skipping: same_content_newer
          skip_after_successful_duplicate: "true"
          paths_ignore: '["**/README.md"]'

  dependencies:
    needs: pre_job
    if: ${{ needs.pre_job.outputs.should_skip != 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup
        uses: ./.github/actions/node-setup

      - name: Check peer dependencies
        run: yarn check:peers

      - name: Check PnP compatibility
        run: |
          yarn test:doctor
          yarn doctor

      - name: Check package consistency
        run: yarn constraints

      - name: Project Reference Check
        run: yarn sync:check

  typecheck:
    needs: pre_job
    if: ${{ needs.pre_job.outputs.should_skip != 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup
        uses: ./.github/actions/node-setup
        with:
          strict: false

      - name: More setup cache
        uses: ./.github/actions/cache-dir
        with:
          key: install-and-check
          paths: |
            .cache
            **/.cache
            dist
            **/dist

      - name: Typechecker
        run: yarn build:type

      - name: Lint & format
        run: |
          ## Require type build
          # https://typescript-eslint.io/getting-started/typed-linting/
          yarn lint

  build:
    needs: pre_job
    if: ${{ needs.pre_job.outputs.should_skip != 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup
        uses: ./.github/actions/node-setup
        with:
          strict: false

      - name: More setup cache
        uses: ./.github/actions/cache-dir
        with:
          key: build-and-test

      - name: Test
        run: yarn test

      - name: Install layout test browser
        run: yarn workspace @examples/layout-playground playwright install --with-deps chromium

      - name: Verify layout geometry in Chromium
        run: yarn workspace @examples/layout-playground test:browser

  production-contract:
    needs: pre_job
    if: ${{ needs.pre_job.outputs.should_skip != 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Yarn download cache
        uses: ./.github/actions/node-setup

      - name: Verify clean package release payloads in isolated consumers
        run: yarn verify:production-contract

      - name: Preserve packed package artifacts
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: production-contract-artifacts
          path: "**/_release/**"
          if-no-files-found: warn
