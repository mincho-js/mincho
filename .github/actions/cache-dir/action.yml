name: Cache Dir
description: Caching for **/.cache

inputs:
  key:
    description: Additional key to be added to the cache key
    required: true
  paths:
    description: Paths to cache
    required: false
    default: |
      .cache
      **/.cache
      configs/vite-config-custom/dist

runs:
  using: composite
  steps:
    - name: Get current day
      id: cache-time
      run: echo "time=$(date +%Y-%j)" >> $GITHUB_OUTPUT
      shell: bash

    - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      id: cache
      with:
        path: |
          ${{ inputs.paths }}
        key: ${{ runner.os }}-cache-${{ inputs.key }}-${{ hashFiles('**/yarn.lock') }}-${{ github.sha }}-${{ steps.cache-time.outputs.time }}
        restore-keys: |
          ${{ runner.os }}-cache-${{ inputs.key }}-${{ hashFiles('**/yarn.lock') }}-
