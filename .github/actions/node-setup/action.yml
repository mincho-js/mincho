name: Setup
description: Node.js setup for CI/CD

inputs:
  strict:
    description: Paths to cache
    required: false
    default: "true"

runs:
  using: composite
  steps:
    - uses: jdx/mise-action@6612f0ef07ed2a736cd1e00a94a065522dd41195 # v5.2.5

    # https://github.com/actions/cache/blob/main/examples.md#node---yarn
    # https://github.blog/changelog/2022-10-11-github-actions-deprecating-save-state-and-set-output-commands/
    - name: Get yarn cache directory path
      id: yarn-cache-dir-path
      run: |
        corepack enable
        echo "dir=$(yarn config get cacheFolder)" >> $GITHUB_OUTPUT
      shell: bash

    - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      id: yarn-cache # use this to check for `cache-hit` (`steps.yarn-cache.outputs.cache-hit != 'true'`)
      with:
        path: |
          ${{ steps.yarn-cache-dir-path.outputs.dir }}
          .yarn/unplugged
          .yarn/build-state.yml
          .yarn/install-state.gz
        key: ${{ runner.os }}-yarn-${{ hashFiles('**/yarn.lock') }}
        restore-keys: |
          ${{ runner.os }}-yarn-

    - name: Package Install
      run: |
        yarn config set --home winLinkType symlinks
        if [ "${{ inputs.strict }}" = "true" ]; then
          yarn install --immutable --check-resolutions --refresh-lockfile
        else
          YARN_ENABLE_HARDENED_MODE=0 yarn install --no-immutable
        fi
      shell: bash
